name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, fix/runtime-verification ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android SDK
        run: |
          test -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version
          test -d /usr/local/lib/android/sdk/platforms/android-35

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile tests, lint and build APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaStream-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  runtime:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Android emulator runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
